name: Release

on:
  push:
    tags:
      - '[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]'

permissions:
  contents: read

jobs:
  verify-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Verify release tag, version, and changelog
        run: tools/check-release.sh "${GITHUB_REF_NAME}"

  test:
    needs: verify-release
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  release:
    needs: [verify-release, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download tested extension package
        uses: actions/download-artifact@v7
        with:
          name: lyric-glance-gnome-51

      - name: Verify package integrity and checksum
        run: |
          unzip -t lyric-glance@eureka.shell-extension.zip
          sha256sum lyric-glance@eureka.shell-extension.zip \
            > lyric-glance@eureka.shell-extension.zip.sha256

      - name: Attach verified release files
        uses: softprops/action-gh-release@v2
        with:
          files: |
            lyric-glance@eureka.shell-extension.zip
            lyric-glance@eureka.shell-extension.zip.sha256
          fail_on_unmatched_files: true
          generate_release_notes: false
