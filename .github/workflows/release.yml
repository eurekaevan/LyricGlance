name: Release

on:
  push:
    tags:
      - '[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    container: fedora:45
    steps:
      - name: Install release dependencies
        run: >-
          dnf --setopt=install_weak_deps=False install -y
          dbus-daemon gettext gjs glib2 gnome-shell libsecret libsoup3
          make mesa-dri-drivers python3.14 python-pip-wheel unzip xorg-x11-server-Xwayland

      - name: Start system D-Bus for Shell tests
        run: |
          mkdir -p /run/dbus
          dbus-daemon --system --fork --nopidfile
          timeout 5s gdbus call --system --dest org.freedesktop.DBus \
            --object-path /org/freedesktop/DBus --method org.freedesktop.DBus.ListNames

      - name: Install shexli review analyzer
        run: |
          python3.14 -m venv /tmp/lyricglance-shexli
          /tmp/lyricglance-shexli/bin/python -m pip install --no-cache-dir \
            'shexli @ https://github.com/GNOME/extensions-web/archive/56e6799ac01e39c0b31d83d350a8b4c15326efd8.tar.gz#subdirectory=shexli' \
            tree-sitter==0.25.2 tree-sitter-javascript==0.25.0
          echo /tmp/lyricglance-shexli/bin >> "$GITHUB_PATH"

      - uses: actions/checkout@v4

      - name: Verify tag and package
        shell: bash
        run: |
          if [[ ! "${GITHUB_REF_NAME}" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] ||
             ! release_date=$(date --date="${GITHUB_REF_NAME}" +%F) ||
             [[ "${release_date}" != "${GITHUB_REF_NAME}" ]]; then
            echo "Invalid release tag: expected a valid YYYY-MM-DD date." >&2
            exit 1
          fi
          make check
          make integration
          make shell-check
          make shell-presentation-check
          make prefs-check
          sha256sum lyric-glance@eureka.shell-extension.zip \
            > lyric-glance@eureka.shell-extension.zip.sha256

      - name: Attach verified release files
        uses: softprops/action-gh-release@v2
        with:
          files: |
            lyric-glance@eureka.shell-extension.zip
            lyric-glance@eureka.shell-extension.zip.sha256
          fail_on_unmatched_files: true
          generate_release_notes: false
