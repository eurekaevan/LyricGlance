name: Release

on:
  push:
    tags:
      - '[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    container: fedora:44
    steps:
      - name: Install release dependencies
        run: >-
          dnf --setopt=install_weak_deps=False install -y
          dbus-daemon gettext gjs glib2 gnome-shell libsecret libsoup3
          make ripgrep unzip

      - uses: actions/checkout@v4

      - name: Verify tag and package
        shell: bash
        run: |
          if [[ ! "${GITHUB_REF_NAME}" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] ||
             ! release_date=$(date --date="${GITHUB_REF_NAME}" +%F) ||
             [[ "${release_date}" != "${GITHUB_REF_NAME}" ]]; then
            echo "Invalid release tag: expected a valid YYYY-MM-DD date." >&2
            exit 1
          fi
          make check
          make integration
          sha256sum lyric-glance@eureka.shell-extension.zip \
            > lyric-glance@eureka.shell-extension.zip.sha256

      - name: Attach verified release files
        uses: softprops/action-gh-release@v2
        with:
          files: |
            lyric-glance@eureka.shell-extension.zip
            lyric-glance@eureka.shell-extension.zip.sha256
          fail_on_unmatched_files: true
          generate_release_notes: false
